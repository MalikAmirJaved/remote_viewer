[package]
name = "vd-agent"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "remote_viewer host agent — capture, encode, send, receive input"
rust-version.workspace = true

[[bin]]
name = "vd-agent"
path = "src/main.rs"

[dependencies]
vd-common = { workspace = true }
vd-proto = { workspace = true }
vd-capture = { workspace = true }
vd-codec = { workspace = true }
vd-net = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
clap = { workspace = true }
postcard = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "signal", "time", "sync"] }

[lints]
workspace = true
